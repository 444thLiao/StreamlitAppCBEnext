---
cluster: "cbe"

# Fixed locations used by the Streamlit app on CBE.next.
attributes:
  modules: ""
  app:
    widget: "radio"
    label: "Applications"
    value: "0"
    help: "Choose the application developed by streamlit."
    options:
      - ["Alphafold3 Screening","0"]
      - ["Small RNA prediction and mRNA Codon Optimization","1"]
  partition:
    widget: "select"
    label: "Partition"
    help: "Slurm partition to submit the job to. Sessions on GPU (g) get one GPU of the type chosen below. Sessions on high memory (m) need at least 200 GB memory."
    options:
      - ["CPU (c)", "c"]
  cores:
    widget: "select"
    label: "CPU cores"
    help: "Number of CPU cores to request (--cpus-per-task)."
    options:
      - ["1", "1"]
  ram:
    widget: "select"
    label: "Memory (GB)"
    help: "Amount of memory to request, in GB. The high memory (m) partition offers 200 GB to 1000 GB; the other partitions up to 128 GB."
    options:
      - ["4 GB", "4", data-only-partition: "c,g"]
      - ["8 GB", "8", data-only-partition: "c,g"]
  bc_num_hours:
    widget: "select"
    label: "Wall time (hours)"
    help: |
      OnDemand sessions can run for at most 12 hours, on every partition.
      For longer work, submit a batch job with `sbatch` from a login node: batch jobs
      can run for up to 14 days.
    value: "4"
    options:
                
# CBE.next uses Slurm. As in the IT example, omit bc_num_slots (node count)
# and bc_email_on_started (email notifications are not configured there).
form:
  - app
  - partition  
  - cores 
  - ram  
  - bc_num_hours  
